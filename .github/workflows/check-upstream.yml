name: Check upstream release

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write

env:
  COPR_OWNER: dupeiran
  COPR_PROJECT: zotero-nightly

jobs:
  check:
    runs-on: ubuntu-latest
    # a full COPR build (srpm phase + 8 chroots) can take the better part of an hour
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream tag
        id: upstream
        run: |
          LATEST=$(git ls-remote --tags --sort=-v:refname \
            https://github.com/zotero/zotero.git '[0-9]*' \
            | grep -v '\^{}' | head -1 | sed 's|.*/||')
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $LATEST"

      - name: Get last built tag
        id: last
        run: |
          if [ -f .last-built-tag ]; then
            echo "tag=$(cat .last-built-tag)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Record the newest COPR build id
        if: steps.upstream.outputs.tag != steps.last.outputs.tag
        id: baseline
        run: |
          BASELINE=$(python3 tools/copr_build_status.py \
            --owner "$COPR_OWNER" --project "$COPR_PROJECT" --id-only)
          echo "id=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "Newest build before triggering: $BASELINE"

      - name: Trigger COPR build if new tag
        if: steps.upstream.outputs.tag != steps.last.outputs.tag
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          echo "New tag found: ${{ steps.upstream.outputs.tag }} (was: ${{ steps.last.outputs.tag }})"
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "$COPR_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "COPR webhook response: HTTP $HTTP_CODE"
          cat /tmp/response.txt
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::COPR webhook failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Update last built tag
        if: steps.upstream.outputs.tag != steps.last.outputs.tag
        run: |
          echo "${{ steps.upstream.outputs.tag }}" > .last-built-tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-built-tag
          git commit -m "Build triggered for ${{ steps.upstream.outputs.tag }}"
          git push

      # The tag is recorded before the outcome is known on purpose, so a broken
      # build fails this job loudly instead of being retried (and quietly lost)
      # every night. Re-run the workflow once the spec is fixed.
      - name: Wait for the COPR build to succeed
        if: steps.upstream.outputs.tag != steps.last.outputs.tag
        run: |
          python3 tools/copr_build_status.py \
            --owner "$COPR_OWNER" --project "$COPR_PROJECT" \
            --after-id "${{ steps.baseline.outputs.id }}" \
            --timeout 5400 --interval 60

      # No new release today: still assert the newest build in the repo is green,
      # so a spec/upstream regression cannot sit unnoticed for months.
      - name: Check the newest published build is healthy
        if: steps.upstream.outputs.tag == steps.last.outputs.tag
        run: |
          python3 tools/copr_build_status.py \
            --owner "$COPR_OWNER" --project "$COPR_PROJECT" --allow-unreachable

